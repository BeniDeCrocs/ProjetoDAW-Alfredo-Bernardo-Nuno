<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registar - Cyber Breach</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">
</head>
<body>
    <div class="login-container bg-auth">
        <div class="efeito-luz-pisca"></div>
        <div class="login-box" style="width: 450px;">
            <div class="header-container">
                <img src="/static/images/titulo_cyberbreach.png" alt="Logo">
            </div>
            
            <div class="panel-dark">
                <h2 class="text-neon-pink mb-20">Novo Registo</h2>
                
                <form method="POST" class="d-flex flex-col gap-15">
                    <input type="text" name="username" placeholder="Novo Username" required>
                    
                    <div style="position: relative; width: 100%;">
                        <input type="password" name="password" placeholder="Nova Password" required style="padding-right: 45px;">
                        <button type="button" class="toggle-password-btn" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: transparent; border: none; cursor: pointer; padding: 0;">
                            <img src="/static/images/hacker_password.png" alt="Mostrar Password" width="20" height="20" style="display: block;">
                        </button>
                    </div>
                    
                    <button type="submit" class="cyber-button btn-pink w-100 mt-10">Criar Conta</button>
                </form>

                <p class="text-muted mt-20" style="font-size: 13px;">
                    Já tens identificação? <a href="{{ url_for('login_page') }}" class="text-neon-pink text-bold" style="text-decoration: none;">Voltar ao Login</a>
                </p>

                {% if form and form.errors %}
                    {% for field, error in form.errors.items() %}
                        <p class="text-red mt-15" style="font-size: 12px;">{{ error }}</p>
                    {% endfor %}
                {% endif %}
            </div>
        </div>
        
        <script src="{{ url_for('static', filename='scripts/code.js') }}" defer></script>
    </div>
</body>
</html>
