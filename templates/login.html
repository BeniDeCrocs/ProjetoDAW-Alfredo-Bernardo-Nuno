<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Cyber Breach</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">
</head>
<body>
    <div class="login-container bg-auth">
        <div class="efeito-luz-pisca"></div>
        <div class="login-box" style="width: 450px;">
            <div class="header-container">
                <img src="/static/images/titulo_cyberbreach.png" alt="Logo">
            </div>
            
            <div class="panel-dark">
                <h2 class="text-neon-green text-center mb-20">Iniciar Sessão</h2>
                
                {# DIV PARA MENSAGEM DE ERRO #}
                <div id="error-message" style="display: none; background-color: rgba(255, 77, 77, 0.2); border: 1px solid #ff4d4d; border-radius: 4px; padding: 10px; margin-bottom: 15px; color: #ff4d4d; font-size: 13px; text-align: center;">
                    ⚠️ <span id="error-text"></span>
                </div>
                
                <form id="login-form" method="POST" class="d-flex flex-col gap-15">
                    <input type="text" id="username" name="username" placeholder="Username" required value="{{ request.form.username if form else '' }}">
                    
                    <div style="position: relative; width: 100%;">
                        <input type="password" id="password" name="password" placeholder="Password" required style="padding-right: 45px;">
                        <button type="button" class="toggle-password-btn" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: transparent; border: none; cursor: pointer; padding: 0;">
                            <img src="/static/images/hacker_password.png" alt="Mostrar Password" width="20" height="20" style="display: block;">
                        </button>
                    </div>
                    
                    <div class="opcoes-checkbox-link mb-10 mt-10">
                        <label class="text-muted" style="cursor: pointer;">
                            <input type="checkbox" name="remember" value="yes"> Lembrar-me
                        </label>
                        <a href="{{ url_for('recover_page') }}" class="text-red" style="font-size: 12px;">Esqueci a password</a>
                    </div>
                    
                    <button type="submit" class="cyber-button btn-green w-100">
                        Entrar no Sistema
                    </button>
                </form>

                <p class="text-muted mt-20 text-center" style="font-size: 13px;">
                    Não tens acesso? <a href="{{ url_for('register_page') }}" class="text-neon-green text-bold" style="text-decoration: none;">Registar Novo Hacker</a>
                </p>

                {% if form and form.errors %}
                    {% for field, error in form.errors.items() %}
                        <p class="text-red mt-15 text-center" style="font-size: 12px;">{{ error }}</p>
                    {% endfor %}
                {% endif %}
            </div>
        </div>
        
        <script>
            // Toggle da password
            const toggleBtn = document.querySelector('.toggle-password-btn');
            const passwordInput = document.getElementById('password');
            
            if (toggleBtn && passwordInput) {
                toggleBtn.addEventListener('click', function() {
                    if (passwordInput.type === 'password') {
                        passwordInput.type = 'text';
                        this.innerHTML = '<img src="/static/images/password_escondida.png" alt="Esconder Password" width="20" height="20" style="display: block;">';
                    } else {
                        passwordInput.type = 'password';
                        this.innerHTML = '<img src="/static/images/hacker_password.png" alt="Mostrar Password" width="20" height="20" style="display: block;">';
                    }
                });
            }
            
            // Login via AJAX para mostrar erro sem refresh
            const loginForm = document.getElementById('login-form');
            const errorDiv = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            
            if (loginForm) {
                loginForm.addEventListener('submit', function(e) {
                    e.preventDefault(); // Impede o refresh da página
                    
                    const username = document.getElementById('username').value;
                    const password = document.getElementById('password').value;
                    const remember = document.querySelector('input[name="remember"]').checked ? 'yes' : '';
                    
                    // Esconder erro anterior
                    errorDiv.style.display = 'none';
                    
                    fetch('/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: new URLSearchParams({
                            'username': username,
                            'password': password,
                            'remember': remember
                        })
                    })
                    .then(response => {
                        if (response.redirected) {
                            // Login bem-sucedido - redirecionar
                            window.location.href = response.url;
                        } else {
                            return response.text();
                        }
                    })
                    .then(html => {
                        if (html && html.includes('login-container')) {
                            // Verificar se há mensagem de erro no HTML retornado
                            if (html.includes('text-red')) {
                                errorText.textContent = '❌ Username ou password incorretos. Tenta novamente.';
                                errorDiv.style.display = 'block';
                                document.getElementById('password').value = ''; // Limpa a password
                                document.getElementById('password').focus();
                            }
                        }
                    })
                    .catch(error => {
                        console.error('Erro:', error);
                        errorText.textContent = '❌ Erro ao tentar fazer login. Tenta novamente.';
                        errorDiv.style.display = 'block';
                    });
                });
            }
        </script>
    </div>
</body>
</html>
