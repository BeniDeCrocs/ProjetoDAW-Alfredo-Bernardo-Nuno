<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Cyber Breach</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">
</head>
<body>
    <div class="login-container bg-auth">
        <div class="efeito-luz-pisca"></div>
        <div class="login-box" style="width: 450px; text-align: center; padding-bottom: 20px;">
            <div class="header-container">
                <img src="/static/images/titulo_cyberbreach.png" alt="Logo">
            </div>
            
            <div style="background-color: rgba(0, 0, 0, 0.75); padding: 30px; border-radius: 6px; border: 1px solid #222; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
                <h2 style="color: #00ffcc; margin-bottom: 20px;">Iniciar Sessão</h2>
                
                <form method="POST" style="display: flex; flex-direction: column; gap: 15px;">
                    <input type="text" name="username" placeholder="Username" required style="width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid #444; color: white; border-radius: 4px;">
                    <input type="password" name="password" placeholder="Password" required style="width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid #444; color: white; border-radius: 4px;">
                    
                    <div class="opcoes-checkbox-link" style="margin-top: -5px; margin-bottom: 5px;">
                        <label style="color: #aaa; cursor: pointer;">
                            <input type="checkbox" name="remember" value="yes"> Lembrar-me
                        </label>
                        <a href="{{ url_for('recover_page') }}" style="color: #ff4d4d; font-size: 12px;">Esqueci a password</a>
                    </div>
                    
                    <button type="submit" style="width: 100%; background-color: #000000; color: #00ffcc; padding: 12px; font-weight: bold; border-radius: 4px; border: 1px solid #111; cursor: pointer; transition: 0.3s;" onmouseover="this.style.backgroundColor='#111'; this.style.borderColor='#00ffcc'" onmouseout="this.style.backgroundColor='#000000'; this.style.borderColor='#111'">Entrar no Sistema</button>
                </form>

                <p style="margin-top: 20px; font-size: 13px; color: #aaa;">
                    Não tens acesso? <a href="{{ url_for('register_page') }}" style="color: #00ffcc; text-decoration: none; font-weight: bold;">Registar Novo Hacker</a>
                </p>

                {% if form and form.errors %}
                    {% for field, error in form.errors.items() %}
                        <p style="color: #ff4d4d; margin-top: 15px; font-size: 12px;">{{ error }}</p>
                    {% endfor %}
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
