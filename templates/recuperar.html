<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Acesso - Cyber Breach</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">
</head>
<body>
    <div class="login-container bg-auth">
        <div class="efeito-luz-pisca"></div>
        <div class="login-box" style="width: 450px;">
            <div class="header-container">
                <img src="/static/images/titulo_cyberbreach.png" alt="Logo">
            </div>

            <div class="panel-dark">
                <h2 class="text-red mb-20">Recuperar Acesso</h2>
                <p class="text-muted mb-20" style="font-size: 13px;">
                    Insere o teu username e uma nova palavra-passe.
                </p>

                <form method="POST" class="d-flex flex-col gap-15">
                    <input type="text" name="username" placeholder="Username" required>
                    
                    <div style="position: relative; width: 100%;">
                        <input type="password" name="new_password" placeholder="Nova Password" required style="padding-right: 45px;">
                        <button type="button" class="toggle-password-btn" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: transparent; border: none; cursor: pointer; padding: 0;">
                            <img src="/static/images/hacker_password.png" alt="Mostrar Password" width="20" height="20" style="display: block;">
                        </button>
                    </div>
                    
                    <div style="position: relative; width: 100%;">
                        <input type="password" name="confirm_password" placeholder="Confirmar Password" required style="padding-right: 45px;">
                        <button type="button" class="toggle-password-btn" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: transparent; border: none; cursor: pointer; padding: 0;">
                            <img src="/static/images/hacker_password.png" alt="Mostrar Password" width="20" height="20" style="display: block;">
                        </button>
                    </div>

                    <button type="submit" class="cyber-button btn-red w-100 mt-10">Redefinir Password</button>
                </form>

                <p class="mt-20">
                    <a href="{{ url_for('login_page') }}" class="text-muted" style="font-size: 12px; text-decoration: none;">Voltar ao Login</a>
                </p>

                {% if error %}
                    <p class="text-red mt-15" style="font-size: 12px;">{{ error }}</p>
                {% endif %}
            </div>
        </div>
        
        <script src="{{ url_for('static', filename='scripts/code.js') }}" defer></script>
    </div>
</body>
</html>
