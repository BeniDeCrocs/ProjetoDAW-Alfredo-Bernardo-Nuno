<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Acesso - Cyber Breach</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">
</head>
<body>
    <div class="login-container bg-auth">
        
        <div class="login-box" style="width: 450px; text-align: center; padding-bottom: 20px;">
            
            <div class="header-container">
                <img src="/static/images/titulo_cyberbreach.png" alt="Logo">
            </div>

            <div style="background-color: rgba(0, 0, 0, 0.75); padding: 30px; border-radius: 6px; border: 1px solid #222; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
                <h2 style="color: #ff4d4d; margin-bottom: 20px;">Recuperar Acesso</h2>
                <p style="font-size: 13px; color: #aaa; margin-bottom: 20px;">
                    Insere o teu username e uma nova palavra-passe.
                </p>

                <form method="POST" style="display: flex; flex-direction: column; gap: 15px;">
                    <input type="text" name="username" placeholder="Username" required style="width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid #444; color: white; border-radius: 4px;">
                    <input type="password" name="new_password" placeholder="Nova Password" required style="width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid #444; color: white; border-radius: 4px;">
                    <input type="password" name="confirm_password" placeholder="Confirmar Password" required style="width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid #444; color: white; border-radius: 4px;">

                    <button type="submit" style="width: 100%; background-color: #000000; color: #ff4d4d; padding: 12px; font-weight: bold; border-radius: 4px; border: 1px solid #111; cursor: pointer; transition: 0.3s; margin-top: 10px;" onmouseover="this.style.backgroundColor='#111'; this.style.borderColor='#ff4d4d'" onmouseout="this.style.backgroundColor='#000000'; this.style.borderColor='#111'">Redefinir Password</button>
                </form>

                <p style="margin-top: 20px;">
                    <a href="{{ url_for('login_page') }}" style="color: #aaa; font-size: 12px; text-decoration: none;">Voltar ao Login</a>
                </p>

                {% if error %}
                    <p style="color: #ff4d4d; margin-top: 15px; font-size: 12px;">{{ error }}</p>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
