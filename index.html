<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PÁGINA LOGIN</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="login-container">
    <div class="efeito-luz-pisca"></div>
    
    <div class="login-box">
    <input type="text" placeholder="Utilizador">
    <input type="password" placeholder="Password">
    
    <div class="opcoes-checkbox-link">
        <label>
            <input type="checkbox"> Relembrar
        </label>
        <a href="#">Recuperar palavra-passe</a>
    </div>

    <button class="btn-login">Entrar</button>
    
    <hr class="linha-divisoria">
    
    <button class="btn-registar">Registar</button>

    <!--ESTE SCRIPT É PARA REMOVER DEPOIS (PARA SER INSERIDO NO JAVA SCRIPT)-->
    <script>
    // 1. O JavaScript vai procurar o input e o ícone do olho
    const passwordInput = document.getElementById('password-input');
    const togglePassword = document.getElementById('toggle-password');

    // 2. Fica à espera que alguém clique no olho
    togglePassword.addEventListener('click', function () {
        
        // 3. Verifica se a password está escondida
        if (passwordInput.type === 'password') {
            // Se estiver, muda para texto normal e muda o ícone para o macaco a tapar os olhos
            passwordInput.type = 'text';
            togglePassword.textContent = '🙈'; 
        } else {
            // Se não, volta a esconder em forma de password e repõe o olho normal
            passwordInput.type = 'password';
            togglePassword.textContent = '👁️'; 
        }
    });
    </script>
    
</div>
</body>
</html>
